
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your InternHub student account.">
  <title>Student Signup | InternHub</title>

  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth.js" defer></script>
</head>

<body>
  <main class="auth-container">
    <section class="auth-card" aria-labelledby="auth-title">

      <a href="/" class="auth-logo">
        Intern<span>Hub</span>
      </a>

      <div class="auth-header">
        <h1 id="auth-title">Create Your Account</h1>
        <p>Join InternHub and discover internship opportunities.</p>
      </div>

      <form id="signupForm" class="auth-form">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            minlength="2"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            maxlength="254"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            minlength="12"
            required
          >
          <small class="input-hint">
            Use at least 12 characters for your password.
          </small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            minlength="12"
            required
          >
        </div>

        <p
          id="authMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></p>

        <button
          type="submit"
          id="submitBtn"
          class="auth-button"
        >
          Create Account
        </button>

      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="/login.html">Log In</a>
      </p>

      <a href="/" class="back-link">
        Back to Internship Board
      </a>

    </section>
  </main>
</body>
</html>
