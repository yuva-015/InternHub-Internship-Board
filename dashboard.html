
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="InternHub student dashboard.">
  <title>Student Dashboard | InternHub</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/dashboard.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <section class="auth-card" aria-labelledby="dashboardTitle">
      <a href="/" class="auth-logo">Intern<span>Hub</span></a>

      <div class="auth-header">
        <h1 id="dashboardTitle">Student Dashboard</h1>
        <p>Manage your internship journey in one place.</p>
      </div>

      <div id="dashboardLoading" role="status">
        Checking your login session...
      </div>

      <div id="dashboardContent" hidden>
        <h2 id="studentName">Welcome!</h2>
        <p>
          <strong>Email:</strong>
          <span id="studentEmail"></span>
        </p>

        <div class="dashboard-actions">
          <a class="auth-button dashboard-link" href="/">
            Explore Internships
          </a>

          <section aria-labelledby="applicationsTitle">
            <h3 id="applicationsTitle">My Applications</h3>
            <p id="applicationsMessage">
              Application tracking is coming soon.
            </p>
          </section>

          <button type="button" id="logoutBtn" class="auth-button">
            Log Out
          </button>
        </div>

        <p id="dashboardMessage" class="auth-message" role="status"></p>
      </div>
    </section>
  </main>
</body>
</html>
